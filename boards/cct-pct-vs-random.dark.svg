<svg xmlns="http://www.w3.org/2000/svg" width="1109" height="654" viewBox="-2.0 -12.0 1109 654"><rect x="-2.0" y="-12.0" width="1109" height="654" fill="#101011" /><g data-shape-id="shape:problem"><path d="M 308.4 19.5 Q 550.0 19.9 791.8 19.9 Q 799.9 19.5 800.5 28.3 Q 800.8 70.0 799.5 112.5 Q 800.0 119.9 791.5 119.4 Q 550.0 120.0 308.4 119.5 Q 300.3 119.8 300.5 111.5 Q 300.8 70.0 300.2 28.4 Q 299.6 20.1 308.4 19.5" fill="#2c3036" stroke="#f2f2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="550.0" y="61.5">难题：10 个线程各跑 20 步，交错组合是天文数字！</tspan><tspan x="550.0" y="85.8">导演该怎么排剧本才能在 100 轮内抓到 Bug？</tspan></text></g><g data-shape-id="shape:naive_rand"><path d="M 38.3 210.5 Q 192.5 210.8 346.5 209.9 Q 355.0 210.2 355.5 217.5 Q 354.4 302.5 355.0 387.5 Q 354.9 395.0 347.2 394.7 Q 192.5 394.5 38.2 395.0 Q 30.1 394.8 30.6 387.4 Q 31.0 302.5 30.0 218.1 Q 29.7 210.1 38.3 210.5" fill="#382726" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="192.5" y="245.4">[误区] 策略 1：每步盲目抛硬币</tspan><tspan x="192.5" y="269.7">(Random)</tspan><tspan x="192.5" y="294.0">每一步都等概率随机挑一个线程走</tspan><tspan x="192.5" y="318.3">缺陷：很难让长任务连续走到深处</tspan><tspan x="192.5" y="342.6">遇到「1步查单 vs 8~25步发货」极易</tspan><tspan x="192.5" y="366.9">失明</tspan></text></g><g data-shape-id="shape:pct_algo"><path d="M 397.8 209.8 Q 552.5 209.7 707.1 210.2 Q 715.3 210.5 714.6 217.9 Q 714.2 302.5 714.7 387.0 Q 714.6 395.4 707.0 394.8 Q 552.5 395.6 397.9 395.1 Q 390.3 395.3 390.2 387.6 Q 390.3 302.5 390.1 217.4 Q 390.2 210.3 397.8 209.8" fill="#262d40" stroke="#4f72fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="552.5" y="257.6">[主力] 策略 2：PCT 关键时刻插队法</tspan><tspan x="552.5" y="281.9">先给每个线程排好固定优先级顺序</tspan><tspan x="552.5" y="306.2">整轮只在随机选出的 d-1 个路口把第1</tspan><tspan x="552.5" y="330.5">名踢到队尾</tspan><tspan x="552.5" y="354.8">适合触发条件只含少数先后约束的缺陷</tspan></text></g><g data-shape-id="shape:urw_algo"><path d="M 757.8 210.2 Q 912.5 209.6 1067.2 209.5 Q 1074.7 210.2 1075.1 218.5 Q 1075.5 302.5 1075.4 387.0 Q 1074.8 395.3 1066.6 394.9 Q 912.5 396.0 757.8 395.1 Q 749.7 394.7 749.6 386.6 Q 750.5 302.5 749.9 217.8 Q 750.5 209.8 757.8 210.2" fill="#253231" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="912.5" y="245.4">[前沿] 策略 3：URW 按剩余步数抽签</tspan><tspan x="912.5" y="269.7">第 0 轮先摸清每个任务还剩多少步要</tspan><tspan x="912.5" y="294.0">走</tspan><tspan x="912.5" y="318.3">剩 8 步的长任务抽中概率是 1 步短任</tspan><tspan x="912.5" y="342.6">务的 8 倍</tspan><tspan x="912.5" y="366.9">本例定长任务的各个插入空位等概率</tspan></text></g><g data-shape-id="shape:dpor_algo"><path d="M 268.2 484.8 Q 550.0 483.9 831.8 485.2 Q 840.3 484.8 839.4 492.6 Q 841.0 547.5 840.4 601.5 Q 839.9 609.5 831.9 610.3 Q 550.0 609.1 267.8 609.9 Q 259.8 609.8 260.5 601.6 Q 259.7 547.5 259.9 492.4 Q 260.0 484.6 268.2 484.8" fill="#342938" stroke="#ae3ec9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="550.0" y="526.9">策略 4　动态偏序约简（DPOR）</tspan><tspan x="550.0" y="551.2">合并独立操作的等价顺序，遇到依赖时安排回溯</tspan><tspan x="550.0" y="575.5">检查范围由模型、内存语义和探索边界决定</tspan></text></g><g data-shape-id="shape:a1"><path d="M 467.0 124.0 L 344.0 204.0" fill="none" stroke="#e03131" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 350.2 193.0 L 344.0 204.0 L 356.5 202.8" fill="none" stroke="#e03131" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="350.5" y="147.0" width="110.0" height="34.0" rx="5" fill="#101011" stroke="#e03131" stroke-width="1" stroke-opacity="0.35" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20.0" text-anchor="middle"><tspan x="405.5" y="168.2">最容易踩坑</tspan></text></g><g data-shape-id="shape:a2"><path d="M 550.6 124.0 L 551.4 204.0" fill="none" stroke="#4f72fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 545.5 192.9 L 551.4 204.0 L 557.1 192.8" fill="none" stroke="#4f72fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="496.0" y="147.0" width="110.0" height="34.0" rx="5" fill="#101011" stroke="#4f72fc" stroke-width="1" stroke-opacity="0.35" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20.0" text-anchor="middle"><tspan x="551.0" y="168.2">工业界标配</tspan></text></g><g data-shape-id="shape:a3"><path d="M 63