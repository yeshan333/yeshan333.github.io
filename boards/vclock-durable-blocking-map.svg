<svg xmlns="http://www.w3.org/2000/svg" width="1059" height="786" viewBox="-7.0 -10.0 1059 786"><rect x="-7.0" y="-10.0" width="1059" height="786" fill="#f9fafb" /><g data-shape-id="shape:title"><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24.0" text-anchor="middle"><tspan x="520.0" y="44.1">Go 1.25 testing/synctest 持久阻塞（Durably Blocked）判定速查图</tspan></text></g><g data-shape-id="shape:center"><path d="M 218.3 85.8 Q 520.0 84.9 821.8 85.4 Q 829.7 85.8 830.4 93.9 Q 828.9 140.0 829.5 185.9 Q 830.2 194.4 822.6 193.6 Q 520.0 194.3 217.9 194.6 Q 209.6 194.2 209.9 186.2 Q 209.6 140.0 209.9 94.6 Q 210.3 86.1 218.3 85.8" fill="#dce1f8" stroke="#4465e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="520.0" y="119.4">Go 1.25 synctest 测试隔离域（bubble）推进顺序</tspan><tspan x="520.0" y="143.7">其余协程均退出或持久阻塞 -&gt; 优先让 Wait() 返回（不先跳 timer）</tspan><tspan x="520.0" y="168.0">无 Wait 且根协程仍在 -&gt; 虚拟时钟推进到下一个到期 timer</tspan></text></g><g data-shape-id="shape:yes_box"><path d="M 32.5 266.2 Q 267.5 264.9 501.7 266.0 Q 510.1 265.5 509.9 273.8 Q 509.4 429.0 510.0 583.9 Q 509.6 591.6 501.7 591.9 Q 267.5 592.4 33.5 592.1 Q 24.6 591.9 24.6 584.2 Q 25.9 429.0 25.5 274.2 Q 24.5 266.3 32.5 266.2" fill="#d3e9e3" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="267.5" y="299.0">【Go 1.25 算作持久阻塞 · Durably Blocked】</tspan><tspan x="267.5" y="323.3">（以 Go 运行时识别的具体阻塞操作为准）</tspan><tspan x="267.5" y="347.6"> </tspan><tspan x="267.5" y="371.9">• time.Sleep(d)（d &gt; 0 实际挂起时）</tspan><tspan x="267.5" y="396.2">• 域内定时器通道阻塞：&lt;-time.After / &lt;-timer.C</tspan><tspan x="267.5" y="420.5">• 本 bubble 创建的 channel 实际阻塞收发</tspan><tspan x="267.5" y="444.8">• 有效 case 全属本 bubble 的阻塞 select（含</tspan><tspan x="267.5" y="469.1">select{} / nil chan）</tspan><tspan x="267.5" y="493.4">• 关联本 bubble 的 WaitGroup.Wait()（首调 Add/Go；</tspan><tspan x="267.5" y="517.7">不含包级值）</tspan><tspan x="267.5" y="542.0">• sync.Cond.Wait() 通知阶段（重抢 L 按锁判）&amp; 关联</tspan><tspan x="267.5" y="566.3">域 &lt;-ctx.Done()</tspan></text></g><g data-shape-id="shape:no_box"><path d="M 542.7 265.9 Q 777.5 266.8 1012.2 266.2 Q 1019.8 265.6 1019.7 274.1 Q 1020.0 429.0 1020.0 584.0 Q 1020.5 592.1 1012.4 591.7 Q 777.5 592.5 542.5 591.9 Q 535.5 592.1 535.3 584.4 Q 535.5 429.0 535.1 274.2 Q 534.9 265.9 542.7 265.9" fill="#f4dadb" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="777.5" y="299.0">【不算持久阻塞 / 其他阻碍快进的状态】</tspan><tspan x="777.5" y="323.3">（可能被域外唤醒，或协程本身仍在运行）</tspan><tspan x="777.5" y="347.6"> </tspan><tspan x="777.5" y="371.9">• sync.Mutex / sync.RWMutex 抢锁（即使域内创建）</tspan><tspan x="777.5" y="396.2">• 普通域外 channel 收发（跨另一 bubble 的 chan 会</tspan><tspan x="777.5" y="420.5">panic）</tspan><tspan x="777.5" y="444.8">• 真实网络 Socket、外部系统调用、普通阻塞 cgo</tspan><tspan x="777.5" y="469.1">• 注意：After / NewTimer / AfterFunc 调用本身不阻</tspan><tspan x="777.5" y="493.4">塞</tspan><tspan x="777.5" y="517.7"> </tspan><tspan x="777.5" y="542.0">【非阻塞但同样阻碍静止判定】</tspan><tspan x="777.5" y="566.3">• 忙等死循环（Goroutine 处于 Running，并非阻塞）</tspan></text></g><g data-shape-id="shape:tip"><path d="M 52.5 640.1 Q 522.5 640.0 991.7 639.5 Q 1000.0 639.6 1000.6 648.2 Q 999.8 692.0 1000.0 735.7 Q 1000.2 743.6 991.8 744.5 Q 522.5 743.7 52.8 743.5 Q 44.6 744.4 45.2 735.5 Q 44.3 692.0 44.5 648.0 Q 45.4 640.2 52.5 640.1" fill="#ecdcf2" stroke="#ae3ec9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="522.5" y="683.5">落地口诀：网络可用域内 net.Pipe（同步无缓冲，不代表真实 TCP 缓冲或磁盘），存储另配可控替身；</tspan><tspan x="522.5" y="707.8">根协程退出后虚拟时间停止推进，Test 仍等待其余协程收尾——仅当全员持久阻塞无法再推进时才报 bubble 死锁！</tspan></text></g><g data-shape-id="shape:cy"><path d="M 469.3 198.0 L 415.2 260.0" fill="none" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 417.5 250.3 L 415.2 260.0 L 424.5 256.4" fill="none" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="383.4" y="213.3" width="117.7" height="31.4" rx="5" fill="#f9fafb" stroke="#099268" stroke-width="1" stroke-opacity="0.35" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="442.2" y="232.8">参与静止判定</tspan></text></g><g data-shape-id="shape:cn"><path d="M 571.7 198.0 L 626.9 260.0" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 617.6 256.4 L 626.9 260.0 L 624.5 250.3" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="521.2" y="213.3" width="156.2" height="31.4" rx="5" fill="#f9fafb" stroke="#e03131" stroke-width="1" stroke-opacity="0.35" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="599.3" y="232.8">不参与 / 阻碍快进</tspan></text></g><g data-shape-id="shape:yt"><path d="M 429.4 596.0 L 466.3 634.0" fill="none" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6.4 4.8" /><path d="M 456.8 630.8 L 466.3 634.0 L 463.4 624.4" fill="none" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g data-shape-id="shape:nt"><path d="M 615.6 596.0 L 578.7 634.0" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6.4 4.8" /><path d="M 581.6 624.4 L 578.7 634.0 L 588.2 630.8" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>
