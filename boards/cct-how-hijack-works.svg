<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="594" viewBox="-2.0 -12.0 1104 594"><rect x="-2.0" y="-12.0" width="1104" height="594" fill="#f9fafb" /><g data-shape-id="shape:top_goal"><path d="M 327.4 19.9 Q 550.0 20.5 772.0 20.1 Q 779.6 19.8 780.3 28.5 Q 779.1 70.0 779.9 112.0 Q 779.9 120.3 772.5 119.9 Q 550.0 120.1 327.9 119.6 Q 319.6 120.3 320.4 111.7 Q 320.3 70.0 319.6 28.5 Q 319.7 19.9 327.4 19.9" fill="#dce1f8" stroke="#4465e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="550.0" y="61.5">两条线程调度拦截路线（接管交错）</tspan><tspan x="550.0" y="85.8">+ Go 运行时确定性时间与阻塞气泡</tspan></text></g><g data-shape-id="shape:rust_way"><path d="M 37.5 200.3 Q 190.0 201.0 341.9 200.2 Q 350.4 200.1 349.9 208.3 Q 349.7 282.5 349.6 356.8 Q 350.2 365.1 341.5 365.6 Q 190.0 364.1 38.1 364.8 Q 30.1 365.4 29.9 357.3 Q 30.4 282.5 29.8 208.2 Q 30.1 199.6 37.5 200.3" fill="#f8e2d4" stroke="#e16919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="190.0" y="249.7">路线 A：编译期「换积木」</tspan><tspan x="190.0" y="274.0">代表：Rust Shuttle / Loom</tspan><tspan x="190.0" y="298.3">把标准库锁和原子变量换成受控版</tspan><tspan x="190.0" y="322.6">同一时刻只放行 1 个轻量协程</tspan></text></g><g data-shape-id="shape:jvm_way"><path d="M 398.4 200.4 Q 550.0 199.3 701.8 200.3 Q 709.6 199.8 709.9 207.8 Q 709.2 282.5 710.1 357.1 Q 709.8 364.9 702.2 365.5 Q 550.0 365.6 397.8 365.6 Q 389.6 365.1 389.4 357.4 Q 390.5 282.5 389.5 207.6 Q 389.7 200.1 398.4 200.4" fill="#ecdcf2" stroke="#ae3ec9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="550.0" y="249.7">路线 B：字节码 / IL「安检门」</tspan><tspan x="550.0" y="274.0">代表：Java Lincheck / C# Coyote</tspan><tspan x="550.0" y="298.3">业务代码几乎不改！加载或构建时</tspan><tspan x="550.0" y="322.6">在共享读写和锁指令前织入暂停钩子</tspan></text></g><g data-shape-id="shape:go_way"><path d="M 757.4 200.2 Q 910.0 199.6 1062.2 200.4 Q 1070.5 200.3 1070.1 208.0 Q 1070.2 282.5 1070.5 357.2 Q 1070.2 364.6 1061.7 364.9 Q 910.0 365.6 757.5 365.6 Q 749.6 365.2 750.1 357.2 Q 749.4 282.5 749.4 207.5 Q 749.6 200.0 757.4 200.2" fill="#d3e9e3" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="910.0" y="237.6">补充：语言运行时「时间气泡」</tspan><tspan x="910.0" y="261.9">代表：Go 1.25 testing/synctest</tspan><tspan x="910.0" y="286.2">接管虚拟时钟与持久阻塞同步</tspan><tspan x="910.0" y="310.5">（注：不探索协程交错，专治超时</tspan><tspan x="910.0" y="334.8">Flaky）</tspan></text></g><g data-shape-id="shape:rust_pro"><path d="M 37.7 439.7 Q 190.0 440.6 341.9 440.0 Q 350.2 439.5 350.0 447.4 Q 350.6 495.0 350.3 542.1 Q 350.3 549.8 342.4 550.2 Q 190.0 551.1 37.4 549.8 Q 30.4 550.0 30.3 541.9 Q 29.6 495.0 30.1 447.7 Q 29.6 440.1 37.7 439.7" fill="#f9f0e6" stroke="#f1ac4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="190.0" y="486.5">优势：切换极快（~75纳秒/步）</tspan><tspan x="190.0" y="510.8">只需通过编译开关切换导入模块</tspan></text></g><g data-shape-id="shape:jvm_pro"><path d="M 398.4 439.8 Q 550.0 440.9 701.5 440.2 Q 709.6 439.9 709.6 447.9 Q 710.7 495.0 710.5 542.0 Q 709.8 550.1 702.6 549.9 Q 550.0 550.8 398.2 550.5 Q 390.0 550.4 390.1 541.7 Q 390.9 495.0 389.5 448.3 Q 390.4 440.3 398.4 439.8" fill="#f5eafa" stroke="#e085f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="550.0" y="486.5">优势：零代码侵入，开箱即用</tspan><tspan x="550.0" y="510.8">还能自动验证并发容器是否线程安全</tspan></text></g><g data-shape-id="shape:go_pro"><path d="M 757.5 439.9 Q 910.0 438.8 1062.5 439.9 Q 1069.9 440.4 1069.9 447.9 Q 1070.6 495.0 1069.5 541.5 Q 1069.8 550.2 1061.5 549.5 Q 910.0 548.8 758.0 550.5 Q 750.0 549.6 750.3 542.5 Q 749.5 495.0 749.6 447.6 Q 749.5 439.9 757.5 439.9" fill="#dbf0e0" stroke="#4cb05e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="910.0" y="474.4">优势：标准库自带，零第三方依赖</tspan><tspan x="910.0" y="498.7">专治 time.Sleep 与 Channel 超时偶</tspan><tspan x="910.0" y="523.0">发失败</tspan></text></g><g data-shape-id="shape:a1"><path d="M 458.5 124.0 L 339.9 194.0" fill="none" stroke="#e16919" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 346.6 183.3 L 339.9 194.0 L 352.5 193.3" fill="none" stroke="#e16919" stroke-width="3.5" stroke-linecap="round" 