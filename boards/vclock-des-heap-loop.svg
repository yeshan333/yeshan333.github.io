<svg xmlns="http://www.w3.org/2000/svg" width="1089" height="596" viewBox="-12.0 -10.0 1089 596"><rect x="-12.0" y="-10.0" width="1089" height="596" fill="#f9fafb" /><g data-shape-id="shape:title"><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24.0" text-anchor="middle"><tspan x="530.0" y="44.1">本文示例 DST 离散事件模拟器（DES）驱动分布式时钟偏移架构</tspan></text></g><g data-shape-id="shape:seed"><path d="M 27.5 115.5 Q 137.5 116.2 247.3 115.7 Q 255.2 115.8 255.4 123.8 Q 254.2 197.0 255.4 269.8 Q 255.1 277.5 247.0 278.3 Q 137.5 277.2 27.5 277.8 Q 19.6 278.5 19.8 269.6 Q 19.7 197.0 20.0 123.9 Q 19.8 116.1 27.5 115.5" fill="#ecdcf2" stroke="#ae3ec9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="137.5" y="152.1">固定随机种子</tspan><tspan x="137.5" y="176.4">Seeded PRNG</tspan><tspan x="137.5" y="200.7"> </tspan><tspan x="137.5" y="225.0">在同实现与受控输入下</tspan><tspan x="137.5" y="249.3">复现网络延迟与节点偏移</tspan></text></g><g data-shape-id="shape:heap"><path d="M 333.5 81.6 Q 530.0 82.9 726.5 82.0 Q 734.6 82.2 735.1 89.7 Q 735.9 197.0 735.1 304.2 Q 734.9 311.8 726.8 311.7 Q 530.0 313.1 332.9 312.3 Q 325.5 311.7 325.4 303.6 Q 325.7 197.0 325.1 90.0 Q 324.8 81.6 333.5 81.6" fill="#dce1f8" stroke="#4465e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="530.0" y="139.9">示例引擎：全局最小堆（Min-Heap）</tspan><tspan x="530.0" y="164.2">按 (SimTime, EventSeq) 确定性排序</tspan><tspan x="530.0" y="188.5">（Rust BinaryHeap 默认最大堆须反转）</tspan><tspan x="530.0" y="212.8">1. CoordExpire @ Sim 10:00:28</tspan><tspan x="530.0" y="237.1">2. Write(C, epoch=2) @ Sim 10:00:29</tspan><tspan x="530.0" y="261.4">3. StaleWrite(B, epoch=1) @ Sim 10:00:29</tspan></text></g><g data-shape-id="shape:clock"><path d="M 812.9 115.9 Q 925.0 116.7 1036.6 116.3 Q 1044.7 116.0 1045.0 124.2 Q 1044.5 197.0 1045.2 269.6 Q 1044.6 278.3 1037.5 277.5 Q 925.0 278.8 813.4 278.3 Q 805.1 277.6 804.9 269.7 Q 805.2 197.0 805.4 124.2 Q 804.9 116.1 812.9 115.9" fill="#d3e9e3" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="925.0" y="139.9">瞬移模拟物理时钟</tspan><tspan x="925.0" y="164.2">SimTime =</tspan><tspan x="925.0" y="188.5">heap.pop().ts</tspan><tspan x="925.0" y="212.8"> </tspan><tspan x="925.0" y="237.1">跳过空白等待</tspan><tspan x="925.0" y="261.4">毫秒重放数天故障路径</tspan></text></g><g data-shape-id="shape:node_a"><path d="M 27.5 406.4 Q 177.5 405.7 327.2 405.5 Q 335.5 405.5 335.0 413.7 Q 335.5 480.0 334.7 545.6 Q 335.2 554.0 327.3 553.5 Q 177.5 553.8 28.3 554.5 Q 19.7 554.3 19.8 546.3 Q 20.5 480.0 20.6 414.6 Q 19.7 405.7 27.5 406.4" fill="#f8e2d4" stroke="#e16919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="177.5" y="422.9">Coordinator（固定偏移 +2s）</tspan><tspan x="177.5" y="447.2">LocalClock = SimTime + 2.0s</tspan><tspan x="177.5" y="471.5"> </tspan><tspan x="177.5" y="495.8">Sim 10:00:28 读 10:00:30 判定到</tspan><tspan x="177.5" y="520.1">期</tspan><tspan x="177.5" y="544.4">颁发新租约 epoch=2 给 Node C</tspan></text></g><g data-shape-id="shape:node_b"><path d="M 383.5 406.4 Q 532.5 405.6 681.8 405.8 Q 689.9 406.4 689.8 413.9 Q 690.2 480.0 690.2 545.7 Q 689.7 554.0 681.6 553.6 Q 532.5 554.7 382.9 553.5 Q 375.5 554.2 375.3 545.9 Q 374.5 480.0 374.9 414.2 Q 375.2 405.9 383.5 406.4" fill="#f4dadb" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="532.5" y="435.1">旧主 Node B（固定偏移 -2s）</tspan><tspan x="532.5" y="459.4">LocalClock = SimTime - 2.0s</tspan><tspan x="532.5" y="483.7"> </tspan><tspan x="532.5" y="508.0">Sim 10:00:29 读 10:00:27</tspan><tspan x="532.5" y="532.3">仍以 epoch=1 向存储发起写请求</tspan></text></g><g data-shape-id="shape:node_c"><path d="M 738.2 405.8 Q 887.5 405.5 1036.8 406.5 Q 1044.7 406.2 1044.6 414.2 Q 1045.8 480.0 1044.5 546.6 Q 1044.5 554.3 1037.4 554.1 Q 887.5 553.2 738.6 553.6 Q 729.9 553.6 729.4 546.1 Q 729.9 480.0 730.5 413.6 Q 730.3 406.3 738.2 405.8" fill="#f9f0e6" stroke="#f1ac4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="887.5" y="435.1">存储端 Fencing &amp; Oracle</tspan><tspan x="887.5" y="459.4">原子记录已接受最大 Token</tspan><tspan x="887.5" y="483.7"> </tspan><tspan x="887.5" y="508.0">见过 epoch=2 后拒收迟到 epoch=1</tspan><tspan x="887.5" y="532.3">违背不变量即打印复现种子</tspan></text></g><