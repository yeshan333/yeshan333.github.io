<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="434" viewBox="-2.0 18.0 1254 434"><rect x="-2.0" y="18.0" width="1254" height="434" fill="#f9fafb" /><g data-shape-id="shape:w_step1"><path d="M 38.3 49.7 Q 185.0 51.0 331.7 49.8 Q 340.1 50.4 340.1 57.5 Q 339.8 117.5 339.7 177.2 Q 339.8 185.0 332.2 184.8 Q 185.0 185.3 38.4 184.4 Q 30.5 184.6 29.6 177.2 Q 29.4 117.5 30.1 58.3 Q 29.6 50.1 38.3 49.7" fill="#dce1f8" stroke="#4465e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="185.0" y="96.9">① 工作线程 (Worker)</tspan><tspan x="185.0" y="121.2">第1次加锁：检查缓存有数据吗？</tspan><tspan x="185.0" y="145.5">读出 true，然后【释放了锁】</tspan></text></g><g data-shape-id="shape:window"><path d="M 477.5 50.5 Q 625.0 51.0 771.8 49.6 Q 780.1 50.0 780.3 58.3 Q 778.9 117.5 780.5 176.8 Q 779.9 185.2 772.1 185.2 Q 625.0 184.8 477.8 185.5 Q 470.3 184.6 469.6 177.4 Q 469.4 117.5 469.6 57.5 Q 469.9 50.3 477.5 50.5" fill="#ecdcf2" stroke="#ae3ec9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="625.0" y="84.7">【致命的跨锁窗口期】</tspan><tspan x="625.0" y="109.0">可控调度器在此处精准喊停！</tspan><tspan x="625.0" y="133.3">强制把工作线程挂起，让清理线程插</tspan><tspan x="625.0" y="157.6">队</tspan></text></g><g data-shape-id="shape:e_step"><path d="M 917.6 50.3 Q 1065.0 50.8 1212.4 49.6 Q 1219.6 49.9 1220.5 58.5 Q 1220.1 117.5 1220.2 177.4 Q 1220.1 184.7 1212.6 184.6 Q 1065.0 185.5 918.4 184.8 Q 910.2 184.9 909.6 177.0 Q 910.4 117.5 909.6 57.9 Q 910.0 49.8 917.6 50.3" fill="#f8e2d4" stroke="#e16919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="1065.0" y="96.9">② 清理线程 (Evictor)</tspan><tspan x="1065.0" y="121.2">趁机加锁，把缓存槽位清空为 None</tspan><tspan x="1065.0" y="145.5">然后释放锁离开</tspan></text></g><g data-shape-id="shape:tsan_note"><path d="M 38.0 280.4 Q 185.0 280.3 331.6 280.2 Q 340.3 280.2 340.0 288.1 Q 340.7 350.0 339.9 411.9 Q 340.0 419.6 331.5 419.7 Q 185.0 420.9 38.2 419.6 Q 29.6 419.9 30.0 411.8 Q 30.6 350.0 29.8 288.4 Q 29.9 279.7 38.0 280.4" fill="#eceef0" stroke="#9fa8b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="185.0" y="329.4">为什么 -race (TSan) 抓不到？</tspan><tspan x="185.0" y="353.7">因为每一步读写都乖乖加了锁</tspan><tspan x="185.0" y="378.0">没有任何「未加锁裸奔读写」！</tspan></text></g><g data-shape-id="shape:w_step2"><path d="M 478.1 280.6 Q 625.0 279.2 771.5 280.2 Q 780.1 279.9 780.2 287.6 Q 780.5 350.0 780.1 412.3 Q 780.0 420.4 771.9 420.2 Q 625.0 419.8 478.2 420.1 Q 470.4 420.2 470.6 412.4 Q 470.0 350.0 469.4 287.9 Q 469.6 279.8 478.1 280.6" fill="#f4dadb" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="625.0" y="329.4">③ 工作线程恢复运行</tspan><tspan x="625.0" y="353.7">以为刚才查过肯定有数据</tspan><tspan x="625.0" y="378.0">第2次加锁直接取值 -&gt; 当场崩溃！</tspan></text></g><g data-shape-id="shape:cct_note"><path d="M 917.9 279.4 Q 1065.0 280.1 1212.0 279.5 Q 1219.8 280.1 1219.7 288.0 Q 1220.9 350.0 1219.5 412.4 Q 1220.1 419.8 1212.4 419.9 Q 1065.0 421.1 918.4 419.7 Q 909.7 419.5 909.5 411.6 Q 910.6 350.0 910.3 287.6 Q 910.1 280.2 917.9 279.4" fill="#d3e9e3" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="1065.0" y="317.2">正确修法：</tspan><tspan x="1065.0" y="341.5">把「检查」和「取值」合并在同一把</tspan><tspan x="1065.0" y="365.8">锁里</tspan><tspan x="1065.0" y="390.1">绝不在两次加锁之间留插队缝隙</tspan></text></g><g data-shape-id="shape:a1"><path d="M 344.0 117.5 L 464.0 117.5" fill="none" stroke="#4465e9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 452.8 123.3 L 464.0 117.5 L 452.8 111.7" fill="none" stroke="#4465e9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="358.6" y="100.5" width="90.8" height="34.0" rx="5" fill="#f9fafb" stroke="#4465e9" stroke-width="1" stroke-opacity="0.35" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20.0" text-anchor="middle"><tspan x="404.0" y="121.7">刚放开锁</tspan></text></g><g data-shape-id="shape:a2"><path d="M 784.0 117.5 L 904.0 117.5" fill="none" stroke="#ae3ec9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 892.8 123.3 L 904.0 117.5 L 892.8 111.7" fill="none" stroke="#ae3ec9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="798.6" y="100.5" width="90.8" height="34.0" rx="5" fill="#f9fafb" stroke="#ae3ec9" stroke-width="1" stroke-opacity="0.35" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20.0" text-anchor="middle"><tspan x="844.0" y="121.7">导演切走</tspan></text></g><g data-shape-id="shape:a3"><path d="M 929.7 189.0 L 768.8 274.0" fill="none" stroke="#e03131" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 776.0 263.6 L 768.8 274.0 L 781.4 273.9" fill="none" stroke="#e03131" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="787.5" y="214.5" width="123.6" height="34.0" rx="5" fill="#f9fafb" stroke="#e03131" stroke-width="1" stroke-opacity="0.35" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20.0" text-anchor="middle"><tspan x="849.3" y="235.7">切回 Worker</tspan></text></g><g data-shape-id="shape:a4"><path d="M 784.0 350.0 L 904.0 350.0" fill="none" stroke="#099268" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 892.8 355.8 L 904.0 350.0 L 892.8 344.2" fill="none" stroke="#099268" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="789.0" y="333.0" width="110.0" height="34.0" rx="5" fill="#f9fafb" stroke="#099268" stroke-width="1" stroke-opacity="0.35" /><text fill="#1d1d1d" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20.0" text-anchor="middle"><tspan x="844.0" y="354.2">复现并修复</tspan></text></g></svg>
