<svg xmlns="http://www.w3.org/2000/svg" width="994" height="736" viewBox="3.0 -8.0 994 736"><rect x="3.0" y="-8.0" width="994" height="736" fill="#101011" /><g data-shape-id="shape:title"><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24.0" text-anchor="middle"><tspan x="500.0" y="46.1">Go 1.25 testing/synctest 持久阻塞（Durably Blocked）判定速查图</tspan></text></g><g data-shape-id="shape:center"><path d="M 323.3 91.8 Q 500.0 90.9 676.8 91.4 Q 684.7 91.8 685.4 99.9 Q 683.9 143.0 684.5 185.9 Q 685.2 194.4 677.6 193.6 Q 500.0 194.3 322.9 194.6 Q 314.6 194.2 314.9 186.2 Q 314.6 143.0 314.9 100.6 Q 315.3 92.1 323.3 91.8" fill="#262d40" stroke="#4f72fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="500.0" y="122.4">synctest 测试隔离域（bubble）静止判定</tspan><tspan x="500.0" y="146.7">域内全员进入「持久阻塞」</tspan><tspan x="500.0" y="171.0">-&gt; 虚拟时钟瞬间快进 / Wait() 返回</tspan></text></g><g data-shape-id="shape:yes_box"><path d="M 42.5 268.2 Q 255.0 266.9 466.7 268.0 Q 475.1 267.5 474.9 275.8 Q 474.4 407.0 475.0 537.9 Q 474.6 545.6 466.7 545.9 Q 255.0 546.4 43.5 546.1 Q 34.6 545.9 34.6 538.2 Q 35.9 407.0 35.5 276.2 Q 34.5 268.3 42.5 268.2" fill="#253231" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="255.0" y="325.6">【算作持久阻塞 · Durably Blocked】</tspan><tspan x="255.0" y="349.9">（只能被域内其他协程或虚拟时钟唤醒）</tspan><tspan x="255.0" y="374.2"> </tspan><tspan x="255.0" y="398.5">• time.Sleep() / time.After() / Timer</tspan><tspan x="255.0" y="422.8">• 域内创建的 channel 收发操作</tspan><tspan x="255.0" y="447.1">• 所有分支皆持久阻塞的 select</tspan><tspan x="255.0" y="471.4">• 域内创建的 sync.WaitGroup.Wait()</tspan><tspan x="255.0" y="495.7">• sync.Cond.Wait() / 域内 Context</tspan></text></g><g data-shape-id="shape:no_box"><path d="M 532.7 267.9 Q 745.0 268.8 957.2 268.2 Q 964.8 267.6 964.7 276.1 Q 965.0 407.0 965.0 538.0 Q 965.5 546.1 957.4 545.7 Q 745.0 546.5 532.5 545.9 Q 525.5 546.1 525.3 538.4 Q 525.5 407.0 525.1 276.2 Q 524.9 267.9 532.7 267.9" fill="#382726" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="745.0" y="325.6">【不算持久阻塞 · Non-Durable】</tspan><tspan x="745.0" y="349.9">（可能被域外世界唤醒，阻碍时钟快进）</tspan><tspan x="745.0" y="374.2"> </tspan><tspan x="745.0" y="398.5">• sync.Mutex / sync.RWMutex 抢锁等待</tspan><tspan x="745.0" y="422.8">• 域外创建的 channel 读写</tspan><tspan x="745.0" y="447.1">• 真实网络 Socket / 文件系统调用</tspan><tspan x="745.0" y="471.4">• CGO 调用与外部信号量</tspan><tspan x="745.0" y="495.7">• 忙等死循环（Goroutine 仍在 Running）</tspan></text></g><g data-shape-id="shape:tip"><path d="M 97.5 604.1 Q 500.0 604.0 901.7 603.5 Q 910.0 603.6 910.6 612.2 Q 909.8 650.0 910.0 687.7 Q 910.2 695.6 901.8 696.5 Q 500.0 695.7 97.8 695.5 Q 89.6 696.4 90.2 687.5 Q 89.3 650.0 89.5 612.0 Q 90.4 604.2 97.5 604.1" fill="#342938" stroke="#ae3ec9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="500.0" y="641.5">落地口诀：把外部网络/磁盘替换成域内 net.Pipe 或内存 Channel；</tspan><tspan x="500.0" y="665.8">退出 synctest.Test 前必须关闭所有后台子协程，否则隔离域收尾直接报死锁 panic！</tspan></text></g><g data-shape-id="shape:cy"><path d="M 449.0 198.0 L 389.6 262.0" fill="none" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 392.2 252.4 L 389.6 262.0 L 399.0 258.6" fill="none" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="369.1" y="214.3" width="100.4" height="31.4" rx="5" fill="#101011" stroke="#099268" stroke-width="1" stroke-opacity="0.35" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="419.3" y="233.8">可安全快进</tspan></text></g><g data-shape-id="shape:cn"><path d="M 551.0 198.0 L 610.4 262.0" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 601.0 258.6 L 610.4 262.0 L 607.8 252.4" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="502.6" y="214.3" width="156.2" height="31.4" rx="5" fill="#101011" stroke="#e03131" stroke-width="1" stroke-opacity="0.35" /><text fill="#f2f2f2" font-family="&quot;Chalkboard SE&quot;, &quot;Comic Sans MS&quot;, &quot;Bradley Hand&quot;, Inter, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18.0" text-anchor="middle"><tspan x="580.7" y="233.8">拒绝快进 / 易挂起</tspan></text></g><g data-shape-id="shape:yt"><path d="M 399.2 550.0 L 447.6 598.0" fill="none" stroke="#099268" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6.4 4.8" /><path d="M 438.0 595.0 L 